[project]
name = "ragl"
version = "0.1.0"
description = "Core library for RAG Lab: chunking, retrieval and evaluation."
authors = [
    { name = "Jyotiraditya Mishra", email = "mishrajyotiraditya49@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.24.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
