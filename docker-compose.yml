services:
  db:
    image: pgvector/pgvector:pg16
    # Local development only. These credentials are deliberately trivial and
    # must not be reused for any deployed database.
    environment:
      POSTGRES_USER: ragl
      POSTGRES_PASSWORD: ragl
      POSTGRES_DB: ragl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragl -d ragl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
